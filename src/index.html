<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@Home</title>
  <base href="/app">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    .app-boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; font-family: Roboto, Arial, sans-serif; color: #5f6368; font-size: 14px; }
    .app-boot-loader__spinner { width: 40px; height: 40px; margin-bottom: 12px; border: 4px solid #e0e0e0; border-top-color: #3f51b5; border-radius: 50%; animation: app-boot-spin 0.8s linear infinite; }
    @keyframes app-boot-spin { to { transform: rotate(360deg); } }
  </style>

</head>
<body>
  <app-root>
    <!-- Shown until Angular bootstraps and replaces the root content -->
    <div class="app-boot-loader" role="status" aria-live="polite">
      <div class="app-boot-loader__spinner"></div>
      <span id="app-boot-loading-text">Loading…</span>
    </div>
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('hhw-lang') || (navigator.language || '').slice(0, 2);
          if (lang === 'th') {
            document.getElementById('app-boot-loading-text').textContent = 'กำลังโหลด…';
            document.documentElement.setAttribute('lang', 'th');
          }
        } catch (e) {}
      })();
    </script>
  </app-root>
</body>
</html>
