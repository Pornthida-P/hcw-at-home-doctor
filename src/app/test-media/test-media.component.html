<ng-container>
  <app-top-nav [title]="'testMedia.pageTitle' | translate" [icon]="'chat'"></app-top-nav>

  <div id="configuration">
    <div class="container">
      <div *ngIf="showSpinner" class="loading">
        <mat-spinner [diameter]="60"></mat-spinner>
      </div>
      <ng-container *ngIf="!showSpinner">
        <div class="left">
          <h2 class="error-message" *ngIf="error" role="alert">{{ error }}</h2>
          <div class="server-status" *ngIf="mediaServerStatus !== 'idle'" role="status">
            <mat-spinner
              *ngIf="mediaServerStatus === 'connecting'"
              [diameter]="16"></mat-spinner>
            <span *ngIf="mediaServerStatus === 'connecting'">{{ 'testMedia.connectingMediaServer' | translate }}</span>
            <span *ngIf="mediaServerStatus === 'connected'" class="ok">{{ 'testMedia.mediaServerConnected' | translate }}</span>
            <span *ngIf="mediaServerStatus === 'failed'" class="failed">{{ 'testMedia.mediaServerFailed' | translate }}</span>
          </div>
          <h2>{{ 'testMedia.microTest' | translate }}</h2>

          <!-- <mat-form-field class="device--select" *ngIf="audioDevices.length > 0">
          <mat-select matNativeControl [required]="audioDevices.length > 1" [(ngModel)]="audioDeviceId" [disabled]="audioDevices.length < 2" (selectionChange)="initAudioPublisher()">
            <mat-option *ngFor="let device of audioDevices; let i = index" [value]="device.deviceId">
              {{ device.label || "device " + (i + 1) }}
            </mat-option>
          </mat-select>
        </mat-form-field> -->

          <div id="volume-container">
            <div id="volume-slider" [style.width.%]="100 - volumeLevel"></div>
          </div>
          <p>{{ 'testMedia.aProperlyTuned' | translate }}</p>
        </div>

        <div class="right">
          <h2>{{ 'testMedia.cameraTest' | translate }}</h2>

          <!-- <mat-form-field class="device--select" *ngIf="videoDevices.length > 0">
          <mat-select matNativeControl [required]="videoDevices.length > 1" [(ngModel)]="videoDeviceId" [disabled]="videoDevices.length < 2" (selectionChange)="initVideoPublisher()">
            <mat-option *ngFor="let device of videoDevices; let i = index" [value]="device.deviceId">
              {{ device.label || "device " + (i + 1) }}
            </mat-option>
          </mat-select>
        </mat-form-field> -->

          <div id="video-container">
            <video
              #localVideo
              *ngIf="localStream && !myCamStream"
              class="local-preview"
              autoplay
              muted
              playsinline></video>
            <app-peer-video
              #streamComponentLocal
              *ngIf="myCamStream"
              [stream]="myCamStream"></app-peer-video>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</ng-container>
