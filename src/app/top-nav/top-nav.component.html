<div class="header">
  <div
    class="menu"
    role="button"
    tabindex="0"
    (click)="toggleSidenav()"
    (keydown.enter)="toggleSidenav()"
    (keydown.space)="$event.preventDefault(); toggleSidenav()">
    <svg
      width="24px"
      height="24px"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg">
      <path
        d="M4 18L20 18"
        stroke="#000000"
        stroke-width="2"
        stroke-linecap="round" />
      <path
        d="M4 12L20 12"
        stroke="#000000"
        stroke-width="2"
        stroke-linecap="round" />
      <path
        d="M4 6L20 6"
        stroke="#000000"
        stroke-width="2"
        stroke-linecap="round" />
    </svg>
  </div>

  <div class="header-items">
    <div
      class="new-consultation"
      role="button"
      tabindex="0"
      (click)="openNurse()"
      (keydown.enter)="openNurse()"
      (keydown.space)="$event.preventDefault(); openNurse()"
      *ngIf="configService?.config?.doctorExternalLink">
      <span>{{ 'topNav.new_consultation_form' | translate }}</span>
      <mat-icon svgIcon="in-new-tab"></mat-icon>
    </div>

    <button
      mat-flat-button
      color="warn"
      *ngIf="showCloseConsBtn"
      (click)="showCloseModal()"
      class="terminate-consultation">
      {{ 'topNav.terminateTheConsultation' | translate }}
    </button>

    <button
      mat-stroked-button
      class="help-button"
      color="primary"
      (click)="startTour()">
      <mat-icon class="help-icon">help</mat-icon>
      <span class="help-button-text">{{ 'topNav.help' | translate }}</span>
    </button>

    <div
      class="user-wrapper"
      role="button"
      tabindex="0"
      (click)="toggleLogout()"
      (keydown.enter)="toggleLogout()"
      (keydown.space)="$event.preventDefault(); toggleLogout()">
      <div [ngClass]="{ 'doc-btn': logoutToggle }" id="user">
        <mat-icon svgIcon="stat"></mat-icon>
        {{
          (currentUser?.firstName || '') + ' ' + (currentUser?.lastName || '')
        }}
        <div class="items" *ngIf="logoutToggle">
          <div
            tourAnchor="{{ TourType.HEADER_PROFILE_MENU }}"
            routerLink="/profile">
            <mat-icon svgIcon="stat"></mat-icon>
            {{ 'topNav.profile' | translate }}
          </div>
          <div
            *ngIf="configService.config?.method === 'openid'"
            role="button"
            tabindex="0"
            (click)="switchUser()"
            (keydown.enter)="switchUser()"
            (keydown.space)="$event.preventDefault(); switchUser()">
            <mat-icon>switch_account</mat-icon>
            {{ 'topNav.switchUser' | translate }}
          </div>
          <div
            class="logout"
            role="button"
            tabindex="0"
            (click)="logout()"
            (keydown.enter)="logout()"
            (keydown.space)="$event.preventDefault(); logout()">
            <mat-icon svgIcon="logout"></mat-icon>
            {{ 'topNav.logout' | translate }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
